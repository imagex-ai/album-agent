  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Profile Hub">
  <meta name="theme-color" content="#0b0d14">
  <title>IMAGEX.AI — Linha do Tempo Mobile</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              400: '#c084fc',
              500: '#a855f7',
              600: '#9333ea',
              700: '#7e22ce',
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      background-color: #0b0d14;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: contain;
    }

    /* Oculta scrollbars nativas para sensação de app nativo */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Animações e Micro-interações */
    .smooth-transition {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes heartBurst {
      0% { transform: scale(1); }
      40% { transform: scale(1.4); }
      70% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    .heart-pop {
      animation: heartBurst 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Tabs do perfil */
    .profile-tab[aria-selected="true"] {
      color: #c084fc;
      font-weight: 700;
      border-bottom: 2px solid #a855f7;
    }
    .profile-tab[aria-selected="false"] {
      color: #9ca3af;
      font-weight: 500;
      border-bottom: 2px solid transparent;
    }

    /* Drawer de comentários deslizante estilo iOS */
    .drawer-backdrop {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Video player scrubber */
    .video-scrubber {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      width: 100%;
    }
    .video-scrubber::-webkit-slider-runnable-track {
      background: rgba(255, 255, 255, 0.25);
      height: 4px;
      border-radius: 9999px;
    }
    .video-scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #a855f7;
      margin-top: -4px;
    }

    .safe-top-pad {
      padding-top: max(0.75rem, var(--sat));
    }
    .safe-bottom-pad {
      padding-bottom: max(1rem, var(--sab));
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>

  <!-- BARRA SUPERIOR NATIVA (STICKY COM SAFE-AREA PARA IPHONE)               -->
  <!-- ======================================================================= -->
  <header class="sticky top-0 z-40 bg-[#0c0e17]/95 backdrop-blur-xl border-b border-[#1f2438] safe-top-pad px-4 pb-3 flex items-center justify-between">

      <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-purple-700 to-indigo-500 flex items-center justify-center font-black text-white text-xs shadow-md">
        ✕
      </div>
      <div>
        <h1 class="font-extrabold text-sm text-white tracking-tight flex items-center gap-1.5">
          <span>IMAGEX.AI</span>
          <span class="text-[9px] px-1.5 py-0.5 rounded bg-purple-900/50 text-purple-300 font-mono border border-purple-500/30">MOBILE</span>
        </h1>
      </div>
    </div>

    <!-- Ações Topo -->
    <div class="flex items-center gap-2">
      <button onclick="showToast('Pesquisar perfis e vídeos')" class="p-2 rounded-xl bg-white/5 active:bg-white/10 text-gray-300" aria-label="Pesquisar">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
      </button>
      <button onclick="showToast('Notificações em dia')" class="p-2 rounded-xl bg-white/5 active:bg-white/10 text-gray-300 relative" aria-label="Notificações">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-purple-500"></span>
      </button>
    </div>
  </header>

  <!-- ======================================================================= -->
  <!-- CONTEÚDO PRINCIPAL (100% LARGURA DA TELA DO CELULAR)                   -->
  <!-- ======================================================================= -->
  <main class="flex-1 w-full max-w-lg mx-auto p-3.5 space-y-4 pb-24">

    <!-- VIEW DA LINHA DO TEMPO MOBILE -->
    <div id="mobile-timeline-view" class="space-y-4">
      
      <!-- Cabeçalho de Boas-Vindas e Abas -->
      <div class="flex items-center justify-between pt-1">
        <div>
          <div class="flex items-center gap-1 text-[11px] text-purple-400 font-bold uppercase tracking-wider">
            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            <span>Profile Hub</span>
          </div>
          <h2 class="text-xl font-black text-white">Linha do tempo</h2>
        </div>

        <div class="flex items-center gap-1.5 bg-[#131624] p-1 rounded-xl border border-[#1f2438]">
          <button onclick="setActiveTab('recentes')" id="tab-recentes-btn" class="px-3 py-1 rounded-lg text-xs font-bold bg-purple-600 text-white shadow-md">
            Recentes
          </button>
          <button onclick="setActiveTab('paravoce')" id="tab-paravoce-btn" class="px-3 py-1 rounded-lg text-xs font-semibold text-gray-400">
            Para você
          </button>
        </div>
      </div>

      <!-- Barra de Stories Horizontais com Fotos Reais dos Criadores -->
      <div class="overflow-hidden bg-[#131624] border border-[#1f2438] rounded-2xl p-3 shadow-lg">
        <div class="flex items-center justify-between pb-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider px-1">
          <span>Criadores Favoritados</span>
          <span id="creators-count-badge" class="text-purple-400 font-mono">25</span>
        </div>
        <div id="dynamic-stories-list" class="flex items-center gap-3.5 overflow-x-auto py-1 no-scrollbar">
          <!-- Inserido dinamicamente via renderStories() -->
        </div>
      </div>

      <!-- Banner de Filtro Ativo por Criador -->
      <div id="creator-filter-banner" class="hidden items-center justify-between p-3 rounded-2xl bg-purple-900/30 border border-purple-500/40 text-xs shadow-lg">
        <div class="flex items-center gap-2.5">
          <img id="filter-banner-avatar" src="" class="w-7 h-7 rounded-full object-cover border border-purple-400">
          <div>
            <span class="text-gray-300">Exibindo de: </span>
            <strong id="filter-banner-name" class="text-white font-bold"></strong>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="if(selectedCreatorId) openCreatorProfile(selectedCreatorId)" class="px-2.5 py-1 rounded-lg bg-purple-600 text-white font-bold text-[11px] shadow">
            Ver Perfil
          </button>
          <button onclick="clearCreatorFilter()" class="px-2.5 py-1 rounded-lg bg-purple-600/30 text-purple-200 text-[11px]">
            Todos
          </button>
        </div>
      </div>

      </div>

    <div id="mobile-profile-view" class="hidden space-y-4">

                <svg class="w-3 h-3 fill-white" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                <span>YouTube</span>
              </div>
              <button onclick="startYouTubePlayer('${post.id}', '${post.youtubeId}')" class="absolute inset-0 m-auto w-12 h-12 rounded-full bg-red-600 text-white flex items-center justify-center shadow-2xl">
                <svg class="w-6 h-6 fill-white ml-0.5" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              </button>
            </div>
          `;
        } else {
          const streamUrl = `/api/proxy-video-stream?url=${encodeURIComponent(post.videoUrl || '')}`;
          mediaHtml = `
            <div id="player-container-${post.id}" class="relative rounded-2xl overflow-hidden mt-2.5 bg-black border border-[#1f2438] aspect-video">
              <video id="vid-${post.id}" src="${streamUrl}" playsinline webkit-playsinline preload="none" ${isGlobalMuted ? 'muted' : ''} ontimeupdate="handleTimeUpdate('${post.id}')" onclick="togglePlayPause('${post.id}')" class="w-full h-full object-cover"></video>
              <img id="poster-${post.id}" src="${thumb}" alt="${post.title}" onclick="startVideoPlay('${post.id}')" class="absolute inset-0 w-full h-full object-cover">
              
              <div id="badges-${post.id}" class="absolute top-2 left-2 flex items-center gap-1.5 pointer-events-none">
                <span class="px-2 py-0.5 rounded bg-black/70 backdrop-blur-md text-white font-bold text-[10px] font-mono">${post.resolution || '1080p'}</span>
                <span class="px-2 py-0.5 rounded bg-black/70 backdrop-blur-md text-gray-300 font-semibold text-[10px]">${post.views || '120k'}</span>
              </div>

              <button id="play-btn-${post.id}" onclick="startVideoPlay('${post.id}')" class="absolute inset-0 m-auto w-12 h-12 rounded-full bg-purple-600 text-white flex items-center justify-center shadow-2xl">
                <svg class="w-6 h-6 fill-white ml-0.5" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              </button>

              <!-- Barra de Controles Inferior -->
              <div id="ctrl-${post.id}" class="hidden absolute bottom-0 inset-x-0 p-2.5 bg-gradient-to-t from-black/90 via-black/50 to-transparent flex flex-col gap-1.5">
                <input type="range" id="scrubber-${post.id}" min="0" max="100" value="0" step="0.1" oninput="handleScrubber('${post.id}', this.value)" class="video-scrubber">
                <div class="flex items-center justify-between text-[11px] text-gray-200">
                  <div class="flex items-center gap-2">
                    <button onclick="togglePlayPause('${post.id}')" class="p-1">
                      <svg id="ctrl-icon-${post.id}" class="w-4 h-4 fill-white" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
                    </button>
                    <button onclick="toggleSound('${post.id}')" class="p-1">
                      <svg id="vol-icon-${post.id}" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                    </button>
                    <span id="time-${post.id}">0:00 / 0:00</span>
                  </div>
                  <button onclick="document.getElementById('vid-${post.id}').requestFullscreen?.() || document.getElementById('vid-${post.id}').webkitEnterFullscreen?.()" class="p-1">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                  </button>
                </div>
              </div>

            </div>
          `;
        }
      }

      return `
        <article class="bg-[#131624] border border-[#1f2438] rounded-2xl p-3.5 shadow-xl space-y-2.5">
          <!-- Topo do Card -->
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5 cursor-pointer" onclick="openCreatorProfile('${post.creatorId}')">
              <img src="${post.creatorAvatar}" alt="${post.creatorName}" class="w-9 h-9 rounded-full object-cover border border-[#272d47]" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(post.creatorName)}&background=7c3aed&color=fff'">
              <div>
                <div class="flex items-center gap-1">
                  <h3 class="text-xs font-bold text-white">${post.creatorName}</h3>
                  <span class="w-3 h-3 rounded-full bg-purple-600 text-white flex items-center justify-center text-[8px] font-bold">✓</span>
                </div>
                <div class="flex items-center gap-1.5 text-[10px] text-gray-500">
                  <span>${post.creatorHandle || '@' + post.creatorId}</span>
                  <span>•</span>
                  <span>${post.date || 'recente'}</span>
                </div>
              </div>
            </div>

            <button onclick="showToast('Opções do post')" class="p-1 text-gray-500 hover:text-white">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
            </button>
          </div>

          <!-- Mídia do Post -->
          ${mediaHtml}

          <!-- Título Limpo -->
          <h4 class="text-xs font-bold text-gray-200 line-clamp-2 pt-1 leading-snug">${post.title}</h4>

          <!-- Barra de Ações Mobile (Ícones Puros em Linha Única Sem Quebra) -->
          <div class="flex items-center justify-between pt-1 border-t border-[#1d2238] text-xs">
            <div class="flex items-center gap-4">
              <!-- Curtir -->
              <button onclick="toggleLike('${post.id}')" class="flex items-center gap-1.5 ${likeColor}">
                <svg class="w-4 h-4 ${isLiked ? 'fill-rose-500 text-rose-500 heart-pop' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                <span class="text-[11px] font-mono">${(post.likes || 120) + (isLiked ? 1 : 0)}</span>
              </button>

              <!-- Comentários -->
              <button onclick="openCommentsModal('${post.id}')" class="flex items-center gap-1.5 text-gray-400 active:text-purple-400">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span class="text-[11px] font-mono">${totalComments}</span>
              </button>
            </div>

            <!-- Salvar, Favoritar e Compartilhar -->
            <div class="flex items-center gap-3">
              <button onclick="toggleFavorite('${post.id}')" class="${favColor}" title="Favoritar">
                <svg class="w-4 h-4 ${isFav ? 'fill-purple-400' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
              </button>

              <button onclick="toggleSave('${post.id}')" class="${saveColor}" title="Salvar">
                <svg class="w-4 h-4 ${isSaved ? 'fill-blue-400' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              </button>

              <button onclick="showToast('Link do post copiado!')" class="text-gray-400 active:text-white" title="Compartilhar">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
              </button>
            </div>
          </div>
        </article>
      `;
    }

    // Video Player Functions
    function startVideoPlay(postId) {
      const poster = document.getElementById(`poster-${postId}`);
      const btn = document.getElementById(`play-btn-${postId}`);
      const vid = document.getElementById(`vid-${postId}`);
      const ctrl = document.getElementById(`ctrl-${postId}`);

      if (poster) poster.classList.add('hidden');
      if (btn) btn.classList.add('hidden');
      if (ctrl) ctrl.classList.remove('hidden');

      if (vid) {
        vid.play().catch(e => console.log('Autoplay:', e));
      }
    }

    function togglePlayPause(postId) {
      const vid = document.getElementById(`vid-${postId}`);
      const icon = document.getElementById(`ctrl-icon-${postId}`);
      if (!vid) return;

      if (vid.paused) {
        vid.play();
        if (icon) icon.innerHTML = '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>';
      } else {
        vid.pause();
        if (icon) icon.innerHTML = '<polygon points="6 3 20 12 6 21 6 3"/>';
      }
    }

    function toggleSound(postId) {
      const vid = document.getElementById(`vid-${postId}`);
      const icon = document.getElementById(`vol-icon-${postId}`);
      if (!vid) return;

      vid.muted = !vid.muted;
      if (icon) {
        icon.innerHTML = vid.muted 
          ? '<path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>'
          : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>';
      }
    }

    function handleTimeUpdate(postId) {
      const vid = document.getElementById(`vid-${postId}`);
      const scrubber = document.getElementById(`scrubber-${postId}`);
      const timeLbl = document.getElementById(`time-${postId}`);
      if (!vid) return;

      if (scrubber && vid.duration) {
        scrubber.value = (vid.currentTime / vid.duration) * 100;
      }
      if (timeLbl) {
        timeLbl.innerText = `${formatSeconds(vid.currentTime)} / ${formatSeconds(vid.duration || 0)}`;
      }
    }

    function handleScrubber(postId, val) {
      const vid = document.getElementById(`vid-${postId}`);
      if (vid && vid.duration) {
        vid.currentTime = (val / 100) * vid.duration;
      }
    }

    function formatSeconds(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function startYouTubePlayer(postId, ytId) {
      const poster = document.getElementById(`poster-${postId}`);
      const btn = document.getElementById(`play-btn-${postId}`);
      const slot = document.getElementById(`yt-slot-${postId}`);

      if (poster) poster.classList.add('hidden');
      if (btn) btn.classList.add('hidden');
      if (slot) {
        slot.classList.remove('hidden');
        slot.innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytId}?autoplay=1&playsinline=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      }
    }

    // Likes & Saves
    function toggleLike(postId) {
      interactionState.likes[postId] = !interactionState.likes[postId];
      renderFeed();
    }
    function toggleFavorite(postId) {
      interactionState.favorites[postId] = !interactionState.favorites[postId];
      showToast(interactionState.favorites[postId] ? 'Adicionado aos Favoritos' : 'Removido dos Favoritos');
      renderFeed();
    }
    function toggleSave(postId) {
      interactionState.saved[postId] = !interactionState.saved[postId];
      showToast(interactionState.saved[postId] ? 'Salvo na sua Biblioteca' : 'Removido da Biblioteca');
      renderFeed();
    }

    // Lightbox
    function openLightbox(url) {
      const modal = document.getElementById('lightbox-modal');
      const img = document.getElementById('lightbox-img');
      if (modal && img) {
        img.src = url;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }
    }
    function closeLightbox() {
      const modal = document.getElementById('lightbox-modal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    // Comentários YouTube
    function openCommentsModal(postId) {
      activeModalPostId = postId;
      const drawer = document.getElementById('comments-drawer');
      const list = document.getElementById('comments-list');
      const badge = document.getElementById('comments-badge');
      if (!drawer || !list) return;

      const post = (AUTHENTIC_DATA.posts || []).find(p => p.id === postId);
      const comments = (post && Array.isArray(post.comments)) ? post.comments : [];
      const userComments = interactionState.userComments[postId] || [];
      const allComments = [...userComments, ...comments];

      if (badge) badge.innerText = allComments.length;

      if (allComments.length === 0) {
        list.innerHTML = `<div class="text-center py-6 text-gray-500 text-xs">Nenhum comentário nesta publicação ainda. Seja o primeiro a comentar!</div>`;
      } else {
        list.innerHTML = allComments.map(c => `
          <div class="flex items-start gap-2.5 text-xs">
            <img src="${c.avatar || 'https://ui-avatars.com/api/?name=User&background=7c3aed&color=fff'}" class="w-7 h-7 rounded-full object-cover shrink-0">
            <div class="flex-1 space-y-0.5">
              <div class="flex items-center gap-1.5">
                <span class="font-bold text-gray-200 text-[11px]">${c.author || '@usuario'}</span>
                <span class="text-[10px] text-gray-500">${c.time || 'recente'}</span>
              </div>
              <p class="text-gray-300 text-xs leading-relaxed">${c.text}</p>
            </div>
          </div>
        `).join('');
      }

      drawer.classList.remove('hidden');
      drawer.classList.add('flex');
    }

    function closeCommentsModal() {
      const drawer = document.getElementById('comments-drawer');
      if (drawer) {
        drawer.classList.add('hidden');
        drawer.classList.remove('flex');
      }
    }

    function submitNewComment() {
      const input = document.getElementById('comment-input');
      if (!input || !input.value.trim() || !activeModalPostId) return;

      if (!interactionState.userComments[activeModalPostId]) {
        interactionState.userComments[activeModalPostId] = [];
      }

      interactionState.userComments[activeModalPostId].unshift({
        author: 'Você (@usuario)',
        avatar: 'https://ui-avatars.com/api/?name=Usuario&background=7c3aed&color=fff',
        text: input.value.trim(),
        time: 'agora',
        likes: 0
      });

      input.value = '';
      openCommentsModal(activeModalPostId);
      renderFeed();
      showToast('Comentário publicado com sucesso!');
    }

    // =======================================================================
    // PERFIL ADAPTATIVO POLIMÓRFICO NATIVO MOBILE (ZERO HARDCODING)
    // =======================================================================
    function openCreatorProfile(creatorId) {
      if (!creatorId) return;
      activeProfileCreatorId = creatorId;
      activeProfileTab = 'feed';

      renderCreatorProfile();

      document.getElementById('mobile-timeline-view').classList.add('hidden');
      document.getElementById('mobile-profile-view').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderStories();
    }

    function closeCreatorProfile() {
      activeProfileCreatorId = null;

      document.getElementById('mobile-profile-view').classList.add('hidden');
      document.getElementById('mobile-timeline-view').classList.remove('hidden');

      renderStories();
    }

    function setProfileTab(tabId) {
      activeProfileTab = tabId;
      renderCreatorProfile();
    }

    function toggleFollowCreator(creatorId) {
      const isFollowing = !interactionState.creatorFollows[creatorId];
      interactionState.creatorFollows[creatorId] = isFollowing;

      const creator = (AUTHENTIC_DATA.creators || []).find(c => c.id === creatorId);
      const name = creator ? creator.name : 'Criador';
      showToast(isFollowing ? `Você agora está seguindo ${name}!` : `Você deixou de seguir ${name}.`);

      renderCreatorProfile();
    }

    function getPlatformMeta(site) {
      const s = (site || '').toLowerCase();
      if (s === 'youtube') {
        return {
          name: 'YouTube',
          badgeText: 'Canal Oficial YouTube',
          badgeBg: 'bg-red-500/10 text-red-400 border-red-500/30',
          iconSvg: '<svg class="w-3.5 h-3.5 fill-red-500" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>'
        };
      } else if (s === 'eporner') {
        return {
          name: 'Eporner',
          badgeText: 'Criador Eporner',
          badgeBg: 'bg-purple-500/10 text-purple-400 border-purple-500/30',
          iconSvg: '<svg class="w-3.5 h-3.5 fill-purple-400" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="#a855f7"/></svg>'
        };
      } else if (s === 'pornhub') {
        return {
          name: 'Pornhub',
          badgeText: 'Perfil Verificado Pornhub',
          badgeBg: 'bg-amber-500/10 text-amber-400 border-amber-500/30',
          iconSvg: '<svg class="w-3.5 h-3.5 fill-amber-400" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>'
        };
      } else if (s === 'xhamster') {
        return {
          name: 'xHamster',
          badgeText: 'Perfil Oficial xHamster',
          badgeBg: 'bg-yellow-500/10 text-yellow-400 border-yellow-500/30',
          iconSvg: '<svg class="w-3.5 h-3.5 fill-yellow-400" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
        };
      }
      return {
        name: 'Profile Hub',
        badgeText: 'Perfil Integrado',
        badgeBg: 'bg-blue-500/10 text-blue-400 border-blue-500/30',
        iconSvg: '<svg class="w-3.5 h-3.5 fill-blue-400" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>'
      };
    }

    function renderCreatorProfile() {
      const container = document.getElementById('mobile-profile-view');
      if (!container || !activeProfileCreatorId) return;

      const creator = (AUTHENTIC_DATA.creators || []).find(c => c.id === activeProfileCreatorId);
      if (!creator) return;

      const allPosts = AUTHENTIC_DATA.posts || [];
      const creatorPosts = allPosts.filter(p => p.creatorId === creator.id || p.author === creator.name);

      const videos = creatorPosts.filter(p => p.type === 'video');
      const albums = creatorPosts.filter(p => p.type === 'photo_grid' || p.type === 'album');

      const totalPosts = creatorPosts.length;
      const totalVideos = videos.length;
      const totalAlbums = albums.length;
      const totalLikes = creatorPosts.reduce((acc, p) => acc + (p.likes || 0), 0);
      const isFollowing = !!(interactionState.creatorFollows && interactionState.creatorFollows[creator.id]);

      const capabilities = {
        hasVideos: totalVideos > 0,
        hasAlbums: totalAlbums > 0
      };

      const tabs = [
        { id: 'feed', label: 'Linha do Tempo', count: totalPosts, icon: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>' }
      ];

      if (capabilities.hasVideos) {
        tabs.push({
          id: 'videos',
          label: 'Vídeos',
          count: totalVideos,
          icon: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 3 20 12 6 21 6 3"/></svg>'
        });
      }

      if (capabilities.hasAlbums) {
        tabs.push({
          id: 'albums',
          label: 'Ensaios / Álbuns',
          count: totalAlbums,
          icon: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>'
        });
      }

      if (!tabs.find(t => t.id === activeProfileTab)) {
        activeProfileTab = 'feed';
      }

      const platform = getPlatformMeta(creator.site);
      const followersLabel = creator.stats && creator.stats.followers ? creator.stats.followers : '120K';
      const destinationFolder = 'data/albums/' + creator.id + '/';

      let contentHtml = '';
      if (activeProfileTab === 'feed') {
        contentHtml = `
          <div class="space-y-4">
            ${creatorPosts.map(p => renderPostCard(p)).join('')}
          </div>
        `;
      } else if (activeProfileTab === 'videos') {
        contentHtml = `
          <div class="grid grid-cols-2 gap-2.5">
            ${videos.map(v => {
              const thumb = v.thumbnail || v.creatorAvatar;
              return `
                <div onclick="setProfileTab('feed'); setTimeout(()=>{ startVideoPlay('${v.id}'); }, 200)" class="bg-[#131624] border border-[#1f2438] rounded-2xl overflow-hidden cursor-pointer shadow-lg flex flex-col">
                  <div class="relative aspect-video bg-black overflow-hidden">
                    <img src="${thumb}" alt="${v.title}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/20 flex items-center justify-center">
                      <div class="w-8 h-8 rounded-full bg-purple-600/90 flex items-center justify-center shadow">
                        <svg class="w-4 h-4 fill-white ml-0.5" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                      </div>
                    </div>
                    <div class="absolute bottom-1.5 right-1.5 px-1 py-0.2 rounded bg-black/80 text-[9px] font-bold text-white font-mono">${v.duration || '12:00'}</div>
                  </div>
                  <div class="p-2 flex-1 flex flex-col justify-between">
                    <h5 class="text-[11px] font-bold text-white line-clamp-2">${v.title}</h5>
                    <div class="flex items-center justify-between text-[10px] text-gray-400 pt-1">
                      <span>${v.views || '100K'}</span>
                      <span class="text-rose-400">♥ ${v.likes || 120}</span>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (activeProfileTab === 'albums') {
        contentHtml = `
          <div class="grid grid-cols-2 gap-2.5">
            ${albums.map(alb => {
              const photos = Array.isArray(alb.photos) ? alb.photos : [];
              const cover = photos[0] || alb.thumbnail || alb.creatorAvatar;
              return `
                <div onclick="openLightbox('${cover}')" class="bg-[#131624] border border-[#1f2438] rounded-2xl overflow-hidden cursor-pointer aspect-square relative flex flex-col justify-end p-2.5 shadow-lg">
                  <img src="${cover}" alt="${alb.title}" class="absolute inset-0 w-full h-full object-cover">
                  <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                  <div class="absolute top-2 right-2 px-1.5 py-0.5 rounded-full bg-black/70 text-[9px] font-bold text-white flex items-center gap-1">
                    <svg class="w-3 h-3 text-pink-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/></svg>
                    <span>${photos.length} fotos</span>
                  </div>
                  <div class="relative z-10">
                    <h5 class="text-[11px] font-bold text-white line-clamp-1">${alb.title}</h5>
                    <p class="text-[9px] text-gray-400">${alb.date || 'Ensaio'}</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="space-y-4">
          <!-- Botão Voltar -->
          <div class="flex items-center justify-between">
            <button onclick="closeCreatorProfile()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#131624] border border-[#1f2438] text-gray-300 text-xs font-semibold shadow">
              <svg class="w-4 h-4 text-purple-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              <span>Voltar para a Linha do Tempo</span>
            </button>
            <span class="text-[10px] font-mono text-gray-500">${creator.id}</span>
          </div>

          <!-- Hero Card Nativo -->
          <div class="bg-[#131624] border border-[#1f2438] rounded-3xl overflow-hidden shadow-2xl relative">
            <div class="relative h-32 w-full overflow-hidden bg-gradient-to-br from-purple-950/70 via-[#131624] to-indigo-950/70">
              <img src="${creator.avatar}" alt="Ambient" class="absolute inset-0 w-full h-full object-cover blur-2xl opacity-40 scale-125" onerror="this.style.display='none'">
              <div class="absolute inset-0 bg-gradient-to-t from-[#131624] via-[#131624]/50 to-black/30"></div>
              
              <div class="absolute top-2.5 right-2.5">
                <a href="${creator.profileUrl || '#'}" target="_blank" class="flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold ${platform.badgeBg} border backdrop-blur-md shadow">
                  ${platform.iconSvg}
                  <span>${platform.badgeText}</span>
                </a>
              </div>
            </div>

            <div class="px-4 pb-4 pt-0 relative">
              <!-- Avatar e Nome -->
              <div class="flex items-end gap-3 -mt-10">
                <div class="relative w-18 h-18 rounded-full p-1 bg-gradient-to-tr from-purple-600 via-indigo-500 to-pink-500 border-4 border-[#131624] shadow-2xl shrink-0">
                  <img src="${creator.avatar}" alt="${creator.name}" class="w-16 h-16 rounded-full object-cover" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(creator.name)}&background=7c3aed&color=fff'">
                  <div class="absolute bottom-0 right-0 w-4 h-4 rounded-full bg-purple-600 border-2 border-[#131624] text-white flex items-center justify-center text-[8px] font-bold">✓</div>
                </div>

                <div class="space-y-0.5 flex-1 min-w-0 pb-1">
                  <h3 class="text-base font-black text-white truncate">${creator.name}</h3>
                  <p class="text-[11px] font-semibold text-purple-400 font-mono truncate">${creator.handle || '@' + creator.id}</p>
                </div>
              </div>

              <!-- Botões de Ação em Linha Dedicada -->
              <div class="flex items-center gap-2 mt-3">
                <button onclick="toggleFollowCreator('${creator.id}')" class="flex-1 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 ${isFollowing ? 'bg-purple-600 text-white shadow-md' : 'bg-white/5 text-gray-200 border border-[#272d47]'}">
                  <svg class="w-4 h-4 ${isFollowing ? 'fill-white' : 'fill-none stroke-currentColor'}" viewBox="0 0 24 24"><path d="m12 21.35-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                  <span>${isFollowing ? 'Seguindo' : 'Seguir Criador'}</span>
                </button>

                <button onclick="showToast('Pasta: ${destinationFolder}')" class="p-2 rounded-xl bg-white/5 border border-[#272d47] text-gray-300">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                </button>

                <button onclick="showToast('Link copiado!')" class="p-2 rounded-xl bg-white/5 border border-[#272d47] text-gray-300">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
                </button>
              </div>

              <!-- Métricas Sociais Reais (Flex Único com Divisores) -->
              <div class="flex items-center justify-around p-2.5 bg-[#0e111a]/80 border border-[#1f2438] rounded-2xl mt-3 text-center">
                <div class="px-1">
                  <span class="block text-xs font-black text-white">${totalPosts}</span>
                  <span class="text-[9px] font-semibold text-gray-400 uppercase">Posts</span>
                </div>
                <div class="w-px h-5 bg-[#1f2438]"></div>
                <div class="px-1">
                  <span class="block text-xs font-black text-purple-400">${totalVideos}</span>
                  <span class="text-[9px] font-semibold text-gray-400 uppercase">Vídeos</span>
                </div>
                ${capabilities.hasAlbums ? `
                <div class="w-px h-5 bg-[#1f2438]"></div>
                <div class="px-1">
                  <span class="block text-xs font-black text-pink-400">${totalAlbums}</span>
                  <span class="text-[9px] font-semibold text-gray-400 uppercase">Álbuns</span>
                </div>` : ''}
                <div class="w-px h-5 bg-[#1f2438]"></div>
                <div class="px-1">
                  <span class="block text-xs font-black text-rose-400">${formatCompact(totalLikes)}</span>
                  <span class="text-[9px] font-semibold text-gray-400 uppercase">Curtidas</span>
                </div>
                <div class="w-px h-5 bg-[#1f2438]"></div>
                <div class="px-1">
                  <span class="block text-xs font-black text-indigo-400">${followersLabel}</span>
                  <span class="text-[9px] font-semibold text-gray-400 uppercase">Inscritos</span>
                </div>
              </div>

            </div>
          </div>

          <!-- Abas Sticky -->
          <div class="sticky top-12 z-30 bg-[#0b0d14]/95 backdrop-blur-md pt-1 pb-1 border-b border-[#1f2438]">
            <div role="tablist" class="flex items-center gap-4 overflow-x-auto no-scrollbar px-1">
              ${tabs.map(t => `
                <button type="button" role="tab" aria-selected="${activeProfileTab === t.id ? 'true' : 'false'}" onclick="setProfileTab('${t.id}')" class="profile-tab flex items-center gap-1.5 pb-2 text-xs focus:outline-none shrink-0">
                  ${t.icon}
                  <span>${t.label}</span>
                  <span class="text-[9px] px-1 py-0.2 rounded-full ${activeProfileTab === t.id ? 'bg-purple-600/30 text-purple-300' : 'bg-white/5 text-gray-400'} font-mono">${t.count}</span>
                </button>
              `).join('')}
            </div>
          </div>

          <!-- Conteúdo da Aba -->
          <div class="pt-1">
            ${contentHtml}
          </div>
        </div>
      `;
    }

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
      renderStories();
      renderFeed();
    });
  </script>
</body>
</html>
